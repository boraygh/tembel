<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FF4D2E; } a:hover { color: #ff7a45; }
  </style>
</helmet>

<div style="position: relative; width: 393px; height: 852px; font-family: Archivo, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; {{pageStyle}}">

  <!-- Alt taraftan yükselen köz -->
  <div style="position: absolute; bottom: -220px; left: 50%; width: 620px; height: 520px; margin-left: -310px; border-radius: 50%; background: {{emberGlow}}; filter: blur(90px); pointer-events: none;"></div>
  <div style="position: absolute; top: -100px; left: 50%; width: 420px; height: 280px; margin-left: -210px; border-radius: 50%; background: {{topGlow}}; filter: blur(80px); pointer-events: none;"></div>

  <!-- Başlık -->
  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 76px 20px 0 20px;">
    <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.32em; color: {{accentHi}}; text-shadow: 0 0 16px {{accent}};">KALK</div>
    <div style="font-size: 52px; font-weight: 800; letter-spacing: -0.05em; line-height: 1.05; font-variant-numeric: tabular-nums;">07:30</div>
    <div style="font-size: 15px; font-weight: 550; color: rgba(255,255,255,0.42);">İşe Kalk</div>
  </div>

  <!-- Görev ilerlemesi -->
  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 32px 0 32px;">
    <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.22em; color: rgba(255,255,255,0.30);">GÖREV 1 / 3</div>
    <div style="display: flex; gap: 6px; width: 100%;">
      <sc-for list="{{segments}}" as="segment" hint-placeholder-count="3">
        <div style="flex-grow: 1; height: 4px; border-radius: 999px; {{segment.style}}"></div>
      </sc-for>
    </div>
  </div>

  <!-- Sallama sayacı -->
  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;">

    <div style="position: relative; width: 244px; height: 244px; display: flex; align-items: center; justify-content: center;">
      <div style="position: absolute; inset: 12px; border-radius: 50%; background: {{ringGlow}}; filter: blur(34px);"></div>

      <svg width="244" height="244" viewBox="0 0 244 244" style="position: absolute; transform: rotate(-90deg);">
        <defs>
          <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="{{accentHi}}"></stop>
            <stop offset="100%" stop-color="{{accent}}"></stop>
          </linearGradient>
        </defs>
        <circle cx="122" cy="122" r="110" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="11"></circle>
        <circle cx="122" cy="122" r="110" fill="none" stroke="url(#ringGradient)" stroke-width="11" stroke-linecap="round" stroke-dasharray="691" stroke-dashoffset="484"></circle>
      </svg>

      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <div style="display: flex; align-items: baseline; gap: 2px;">
          <span style="font-size: 66px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums;">3</span>
          <span style="font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.26);">/10</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{accentHi}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="18" rx="2"></rect><path d="M4 9v6"></path><path d="M20 9v6"></path></svg>
        <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em;">Telefonu salla</span>
      </div>
      <span style="font-size: 13px; font-weight: 450; color: rgba(255,255,255,0.32);">Kalan 7 sallama</span>
    </div>
  </div>

  <!-- Erteleme -->
  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 20px 40px 20px;">
    <div style="width: 100%; height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; {{snoozeStyle}}">
      <span style="font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.50);">Ertele</span>
    </div>
    <span style="font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.24);">1 hak kaldı</span>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "accent": { "editor": "color", "default": "#FF4D2E", "options": ["#FF4D2E", "#FFB300", "#4ADE80", "#7C5CFF"] }
}'>
class Component extends DCLogic {
  shift(hex, amount) {
    const value = parseInt(hex.slice(1), 16);
    const channel = (offset) => {
      const raw = ((value >> offset) & 255) + amount;
      return Math.max(0, Math.min(255, raw));
    };
    return '#' + [channel(16), channel(8), channel(0)]
      .map((c) => c.toString(16).padStart(2, '0')).join('');
  }

  renderVals() {
    const accent = this.props.accent ?? '#FF4D2E';
    const accentHi = this.shift(accent, 38);

    // Üç görevden ilki sürüyor: tamamlanan yok, yürüyen vurgulu.
    const segments = [
      { style: 'background: linear-gradient(90deg, ' + accentHi + ', ' + accent + ');' },
      { style: 'background: rgba(255,255,255,0.07);' },
      { style: 'background: rgba(255,255,255,0.07);' }
    ];

    return {
      accent,
      accentHi,
      segments,
      // Zemin aşağıdan yukarı ısınıyor: dikkat ekranın ortasındaki
      // sayaca toplanıyor, alarmın "yanan" hissi veriliyor.
      pageStyle: 'background: linear-gradient(180deg, #0C0C12 0%, #08080C 55%, #0D0A0C 100%);',
      topGlow: 'radial-gradient(circle, ' + accent + '2A 0%, transparent 70%)',
      emberGlow: 'radial-gradient(circle, ' + accent + '38 0%, transparent 70%)',
      ringGlow: 'radial-gradient(circle, ' + accent + '30 0%, transparent 68%)',
      snoozeStyle:
        'background: rgba(255,255,255,0.045);' +
        'box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);'
    };
  }
}
</script>
</body>
</html>
