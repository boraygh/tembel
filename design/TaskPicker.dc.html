<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FF4D2E; } a:hover { color: #ff6a50; }
  </style>
</helmet>

<div style="width: 393px; height: 640px; background: #131318; font-family: Archivo, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; border-radius: 28px 28px 0 0; overflow: hidden;">

  <!-- Tutamak -->
  <div style="display: flex; justify-content: center; padding: 10px 0 6px 0;">
    <div style="width: 36px; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.16);"></div>
  </div>

  <!-- Başlık -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 20px 16px;">
    <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em;">Görev Ekle</div>
    <div style="font-size: 16px; font-weight: 700; color: {{accent}};">Ekle</div>
  </div>

  <!-- Görev türleri -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px;">
    <sc-for list="{{types}}" as="type" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; {{type.cardStyle}}">
        <div style="width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; {{type.iconBoxStyle}}">
          <sc-if value="{{type.isShake}}" hint-placeholder-val="{{true}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{type.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="18" rx="2"></rect><path d="M4 9v6"></path><path d="M20 9v6"></path></svg>
          </sc-if>
          <sc-if value="{{type.isMath}}" hint-placeholder-val="{{true}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{type.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h7"></path><path d="M7.5 3.5v7"></path><path d="M13.5 17h7"></path><path d="M14 6.5l6 6"></path><path d="M20 6.5l-6 6"></path></svg>
          </sc-if>
          <sc-if value="{{type.isPhoto}}" hint-placeholder-val="{{true}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{type.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.2-2h6.2l1.2 2h1.7A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5Z"></path><circle cx="12" cy="12.5" r="3"></circle></svg>
          </sc-if>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 16px; font-weight: 700;">{{type.title}}</div>
          <div style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.56);">{{type.description}}</div>
        </div>
        <sc-if value="{{type.selected}}" hint-placeholder-val="{{true}}">
          <div style="width: 24px; height: 24px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B0B0F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 5 5L19 7"></path></svg>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <!-- Seçilen görevin ayarı -->
  <div style="padding: 24px 16px 0 16px;">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: rgba(255,255,255,0.32); text-transform: uppercase; padding-bottom: 12px;">Ayar</div>

    <div style="border-radius: 18px; background: #1B1B22; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <div style="font-size: 14px; font-weight: 550; color: rgba(255,255,255,0.56);">Kaç kez sallanacak?</div>
      <div style="display: flex; align-items: center; gap: 24px;">
        <div style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"></path></svg>
        </div>
        <div style="min-width: 92px; text-align: center; font-size: 44px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums;">10</div>
        <div style="width: 44px; height: 44px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B0F" stroke-width="3" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </div>
      </div>
      <div style="display: flex; gap: 6px;">
        <sc-for list="{{presets}}" as="preset" hint-placeholder-count="4">
          <div style="padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 650; {{preset.style}}">{{preset.label}}</div>
        </sc-for>
      </div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "accent": { "editor": "color", "default": "#FF4D2E", "options": ["#FF4D2E", "#FFB300", "#4ADE80", "#7C5CFF"] },
  "selectedType": { "editor": "enum", "default": "shake", "options": ["shake", "math", "photo"] }
}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF4D2E';
    const chosen = this.props.selectedType ?? 'shake';

    const definitions = [
      { key: 'shake', title: 'Salla', description: 'Telefonu belirlediğin kadar salla', isShake: true, isMath: false, isPhoto: false },
      { key: 'math', title: 'Matematik', description: 'İşlemi doğru çözmeden kapanmaz', isShake: false, isMath: true, isPhoto: false },
      { key: 'photo', title: 'Fotoğraf', description: 'Belirlediğin nesnenin fotoğrafını çek', isShake: false, isMath: false, isPhoto: true }
    ];

    const types = definitions.map((definition) => {
      const selected = definition.key === chosen;
      return {
        ...definition,
        selected,
        cardStyle: selected
          ? 'background: ' + accent + '14; border: 1px solid ' + accent + '4D;'
          : 'background: #1B1B22; border: 1px solid transparent;',
        iconBoxStyle: selected
          ? 'background: ' + accent + '26;'
          : 'background: rgba(255,255,255,0.06);',
        iconColor: selected ? accent : 'rgba(255,255,255,0.56)'
      };
    });

    const presets = [5, 10, 25, 50].map((value) => ({
      label: String(value),
      style: value === 10
        ? 'background: ' + accent + '; color: #0B0B0F;'
        : 'background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.56);'
    }));

    return { accent, types, presets };
  }
}
</script>
</body>
</html>
