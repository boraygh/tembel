<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FF4D2E; } a:hover { color: #ff6a50; }
  </style>
</helmet>

<div style="width: 393px; height: 660px; background: #101015; font-family: Archivo, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; border-radius: 30px 30px 0 0; overflow: hidden;">

  <div style="display: flex; justify-content: center; padding: 12px 0 4px 0;">
    <div style="width: 36px; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.14);"></div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 22px 20px;">
    <div style="font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.45);">Vazgeç</div>
    <div style="font-size: 16px; font-weight: 700; color: {{accent}};">Ekle</div>
  </div>

  <!-- Görev türleri -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 20px;">
    <sc-for list="{{types}}" as="type" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; {{type.cardStyle}}">
        <div style="width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; {{type.iconBoxStyle}}">
          <sc-if value="{{type.isShake}}" hint-placeholder-val="{{true}}">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{type.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="18" rx="2"></rect><path d="M4 9v6"></path><path d="M20 9v6"></path></svg>
          </sc-if>
          <sc-if value="{{type.isMath}}" hint-placeholder-val="{{true}}">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{type.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h7"></path><path d="M7.5 3.5v7"></path><path d="M13.5 17h7"></path><path d="M14 6.5l6 6"></path><path d="M20 6.5l-6 6"></path></svg>
          </sc-if>
          <sc-if value="{{type.isPhoto}}" hint-placeholder-val="{{true}}">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{type.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.2-2h6.2l1.2 2h1.7A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5Z"></path><circle cx="12" cy="12.5" r="3"></circle></svg>
          </sc-if>
        </div>

        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 16px; font-weight: 700; {{type.titleStyle}}">{{type.title}}</span>
            <sc-if value="{{type.locked}}" hint-placeholder-val="{{true}}">
              <span style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px 2px 5px; border-radius: 999px; background: {{accent}}1F;">
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
                <span style="font-size: 10px; font-weight: 800; color: {{accent}}; letter-spacing: 0.03em;">PREMIUM</span>
              </span>
            </sc-if>
          </div>
          <div style="font-size: 13px; font-weight: 450; color: rgba(255,255,255,0.42);">{{type.description}}</div>
        </div>

        <sc-if value="{{type.selected}}" hint-placeholder-val="{{true}}">
          <div style="width: 22px; height: 22px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0B0B0F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 5 5L19 7"></path></svg>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <!-- Ayar -->
  <div style="padding: 26px 20px 0 20px;">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: rgba(255,255,255,0.30); padding-bottom: 12px;">AYAR</div>

    <div style="border-radius: 18px; background: #191920; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 18px;">
      <div style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.45);">Kaç kez sallanacak?</div>
      <div style="display: flex; align-items: center; gap: 28px;">
        <div style="width: 46px; height: 46px; border-radius: 999px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"></path></svg>
        </div>
        <div style="min-width: 88px; text-align: center; font-size: 46px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums;">10</div>
        <div style="width: 46px; height: 46px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B0F" stroke-width="3" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </div>
      </div>
      <div style="display: flex; gap: 7px;">
        <sc-for list="{{presets}}" as="preset" hint-placeholder-count="4">
          <div style="padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; {{preset.style}}">{{preset.label}}</div>
        </sc-for>
      </div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "accent": { "editor": "color", "default": "#FF4D2E", "options": ["#FF4D2E", "#FFB300", "#4ADE80", "#7C5CFF"] },
  "selectedType": { "editor": "enum", "default": "shake", "options": ["shake", "math", "photo"] },
  "isPremium": { "editor": "boolean", "default": false }
}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF4D2E';
    const chosen = this.props.selectedType ?? 'shake';
    const isPremium = this.props.isPremium ?? false;

    const definitions = [
      { key: 'shake', title: 'Salla', description: 'Telefonu belirlediğin kadar salla', premiumOnly: false, isShake: true, isMath: false, isPhoto: false },
      { key: 'math', title: 'Matematik', description: 'İşlemi doğru çözmeden kapanmaz', premiumOnly: false, isShake: false, isMath: true, isPhoto: false },
      { key: 'photo', title: 'Fotoğraf', description: 'Yataktan kalkmadan çekemeyeceğin bir şey', premiumOnly: true, isShake: false, isMath: false, isPhoto: true }
    ];

    const types = definitions.map((definition) => {
      const locked = definition.premiumOnly && !isPremium;
      const selected = definition.key === chosen && !locked;
      return {
        ...definition,
        locked,
        selected,
        cardStyle: selected
          ? 'background: ' + accent + '12; border: 1px solid ' + accent + '40;'
          : 'background: #191920; border: 1px solid transparent;' + (locked ? ' opacity: 0.62;' : ''),
        iconBoxStyle: selected
          ? 'background: ' + accent + '22;'
          : 'background: rgba(255,255,255,0.05);',
        iconColor: selected ? accent : 'rgba(255,255,255,0.45)',
        titleStyle: locked ? 'color: rgba(255,255,255,0.75);' : 'color: #FFFFFF;'
      };
    });

    const presets = [5, 10, 25, 50].map((value) => ({
      label: String(value),
      style: value === 10
        ? 'background: ' + accent + '; color: #0B0B0F;'
        : 'background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.50);'
    }));

    return { accent, types, presets };
  }
}
</script>
</body>
</html>
