<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FF4D2E; } a:hover { color: #ff6a50; }
  </style>
</helmet>

<div style="width: 393px; height: 852px; background: #0B0B0F; font-family: Archivo, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 72px 20px 0 20px;">
    <div style="font-size: 32px; font-weight: 800; letter-spacing: -0.03em;">Alarmlar</div>
    <div style="width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 0 44px 90px 44px; text-align: center;">

    <div style="position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center;">
      <div style="position: absolute; inset: -16px; border-radius: 50%; background: {{glow}}; filter: blur(26px);"></div>
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="position: relative;"><circle cx="12" cy="13" r="8"></circle><path d="M12 9.5V13l2.5 1.5"></path><path d="M5 3 2.5 5.5"></path><path d="m19 3 2.5 2.5"></path></svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em;">Henüz alarm yok</div>
      <div style="font-size: 15px; font-weight: 450; line-height: 1.5; color: rgba(255,255,255,0.45); text-wrap: pretty;">Kapatmak için görev tamamlaman gereken bir alarm kur.</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 52px; padding: 0 26px; border-radius: 16px; background: {{accent}};">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0B0B0F" stroke-width="3" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
      <span style="font-size: 16px; font-weight: 800; color: #0B0B0F;">İlk alarmını kur</span>
    </div>
  </div>

  <div style="display: flex; border-top: 1px solid rgba(255,255,255,0.06); background: #0D0D12; padding: 12px 0 30px 0;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9.5V13l2.5 1.5"></path><path d="M5 3 2.5 5.5"></path><path d="m19 3 2.5 2.5"></path></svg>
      <span style="font-size: 10px; font-weight: 700; color: {{accent}};">Alarmlar</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 14.6 9l6 .9-4.3 4.2 1 6-5.3-2.8L6.7 20l1-6L3.4 9.9l6-.9Z"></path></svg>
      <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.30);">Premium</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"></path></svg>
      <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.30);">Ayarlar</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "accent": { "editor": "color", "default": "#FF4D2E", "options": ["#FF4D2E", "#FFB300", "#4ADE80", "#7C5CFF"] }
}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF4D2E';
    return { accent, glow: 'radial-gradient(circle, ' + accent + '2E 0%, transparent 70%)' };
  }
}
</script>
</body>
</html>
