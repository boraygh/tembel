<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FF4D2E; } a:hover { color: #ff7a45; }
  </style>
</helmet>

<div style="position: relative; width: 393px; height: 852px; font-family: Archivo, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; {{pageStyle}}">

  <div style="position: absolute; top: -140px; left: 50%; width: 460px; height: 340px; margin-left: -230px; border-radius: 50%; background: {{topGlow}}; filter: blur(70px); pointer-events: none;"></div>

  <!-- Başlık -->
  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 72px 20px 0 20px;">
    <div style="font-size: 34px; font-weight: 800; letter-spacing: -0.035em;">Alarmlar</div>
    <div style="width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; {{iconButtonStyle}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accentHi}}" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </div>
  </div>

  <!-- Sonraki alarm -->
  <div style="position: relative; display: flex; align-items: center; gap: 9px; padding: 12px 20px 26px 20px;">
    <span style="width: 7px; height: 7px; border-radius: 999px; background: {{accent}}; box-shadow: 0 0 10px {{accent}};"></span>
    <span style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.42);">Sonraki alarm <span style="color: rgba(255,255,255,0.92); font-weight: 650;">8 sa 42 dk</span> sonra</span>
  </div>

  <!-- Alarm listesi -->
  <div style="position: relative; display: flex; flex-direction: column; gap: 13px; padding: 0 20px; flex-grow: 1;">
    <sc-for list="{{alarms}}" as="alarm" hint-placeholder-count="3">
      <div style="padding: 20px; display: flex; flex-direction: column; gap: 15px; {{alarm.cardStyle}}">

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
          <div style="font-size: 46px; font-weight: 800; letter-spacing: -0.055em; line-height: 1; font-variant-numeric: tabular-nums; {{alarm.timeStyle}}">{{alarm.time}}</div>
          <div style="width: 52px; height: 32px; border-radius: 999px; display: flex; align-items: center; padding: 2.5px; box-sizing: border-box; flex-shrink: 0; {{alarm.toggleTrackStyle}}">
            <div style="width: 27px; height: 27px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 5px rgba(0,0,0,0.4); {{alarm.toggleKnobStyle}}"></div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 15px; font-weight: 650; color: rgba(255,255,255,0.95);">{{alarm.title}}</span>
          <span style="width: 3px; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.18);"></span>
          <span style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.42);">{{alarm.repeatSummary}}</span>
        </div>

        <div style="display: flex; align-items: center; gap: 7px;">
          <sc-for list="{{alarm.taskIcons}}" as="icon" hint-placeholder-count="3">
            <div style="width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; {{alarm.iconBoxStyle}}">
              <sc-if value="{{icon.isShake}}" hint-placeholder-val="{{true}}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{alarm.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="18" rx="2"></rect><path d="M4 9v6"></path><path d="M20 9v6"></path></svg>
              </sc-if>
              <sc-if value="{{icon.isMath}}" hint-placeholder-val="{{true}}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{alarm.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h7"></path><path d="M7.5 3.5v7"></path><path d="M13.5 17h7"></path><path d="M14 6.5l6 6"></path><path d="M20 6.5l-6 6"></path></svg>
              </sc-if>
              <sc-if value="{{icon.isPhoto}}" hint-placeholder-val="{{true}}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{alarm.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.2-2h6.2l1.2 2h1.7A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5Z"></path><circle cx="12" cy="12.5" r="3"></circle></svg>
              </sc-if>
            </div>
          </sc-for>
          <span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.26); padding-left: 3px;">{{alarm.taskLabel}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- Sekme çubuğu -->
  <div style="position: relative; display: flex; padding: 13px 0 30px 0; {{tabBarStyle}}">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="{{accentHi}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 7px {{accent}}80);"><circle cx="12" cy="13" r="8"></circle><path d="M12 9.5V13l2.5 1.5"></path><path d="M5 3 2.5 5.5"></path><path d="m19 3 2.5 2.5"></path></svg>
      <span style="font-size: 10px; font-weight: 700; color: {{accentHi}};">Alarmlar</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.26)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 14.6 9l6 .9-4.3 4.2 1 6-5.3-2.8L6.7 20l1-6L3.4 9.9l6-.9Z"></path></svg>
      <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.26);">Premium</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.26)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"></path></svg>
      <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.26);">Ayarlar</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "accent": { "editor": "color", "default": "#FF4D2E", "options": ["#FF4D2E", "#FFB300", "#4ADE80", "#7C5CFF"] }
}'>
class Component extends DCLogic {
  shift(hex, amount) {
    const value = parseInt(hex.slice(1), 16);
    const channel = (offset) => {
      const raw = ((value >> offset) & 255) + amount;
      return Math.max(0, Math.min(255, raw));
    };
    return '#' + [channel(16), channel(8), channel(0)]
      .map((c) => c.toString(16).padStart(2, '0')).join('');
  }

  renderVals() {
    const accent = this.props.accent ?? '#FF4D2E';
    const accentHi = this.shift(accent, 38);

    // Kart yüzeyi: üstte 1px ışık çizgisi + hafif dikey gradyan.
    // Düz dolgu yerine bu ikisi, kartı ekrana yapışık değil üstünde
    // duruyormuş gibi gösteriyor.
    const card =
      'border-radius: 26px;' +
      'background: linear-gradient(180deg, #1C1C24 0%, #141419 100%);' +
      'box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 28px rgba(0,0,0,0.42);';

    const shake = { isShake: true, isMath: false, isPhoto: false };
    const math = { isShake: false, isMath: true, isPhoto: false };
    const photo = { isShake: false, isMath: false, isPhoto: true };

    const activeToggle =
      'background: linear-gradient(135deg, ' + accentHi + ' 0%, ' + accent + ' 100%);' +
      'box-shadow: 0 3px 12px ' + accent + '66;';

    const litTime = 'color: #FFFFFF; text-shadow: 0 2px 22px rgba(255,255,255,0.10);';

    const alarms = [
      {
        time: '07:30', title: 'İşe Kalk', repeatSummary: 'Hafta içi',
        taskIcons: [shake, math, photo], taskLabel: '3 görev',
        cardStyle: card, timeStyle: litTime, iconColor: accentHi,
        iconBoxStyle: 'background: rgba(255,255,255,0.045); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);',
        toggleTrackStyle: activeToggle, toggleKnobStyle: 'margin-left: auto;'
      },
      {
        time: '08:45', title: 'Spor', repeatSummary: 'Sal, Per',
        taskIcons: [shake, math], taskLabel: '2 görev',
        cardStyle: card, timeStyle: litTime, iconColor: accentHi,
        iconBoxStyle: 'background: rgba(255,255,255,0.045); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);',
        toggleTrackStyle: activeToggle, toggleKnobStyle: 'margin-left: auto;'
      },
      {
        time: '06:15', title: 'Erken Kalk', repeatSummary: 'Hafta sonu',
        taskIcons: [math], taskLabel: '1 görev',
        cardStyle: card + 'opacity: 0.34;', timeStyle: 'color: #FFFFFF;',
        iconColor: 'rgba(255,255,255,0.5)',
        iconBoxStyle: 'background: rgba(255,255,255,0.045);',
        toggleTrackStyle: 'background: rgba(255,255,255,0.09);', toggleKnobStyle: ''
      }
    ];

    return {
      accent,
      accentHi,
      alarms,
      pageStyle: 'background: linear-gradient(180deg, #101017 0%, #0A0A0E 45%, #07070A 100%);',
      topGlow: 'radial-gradient(circle, ' + accent + '26 0%, transparent 70%)',
      iconButtonStyle:
        'background: linear-gradient(180deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.04) 100%);' +
        'box-shadow: inset 0 1px 0 rgba(255,255,255,0.09);',
      tabBarStyle:
        'background: linear-gradient(180deg, rgba(16,16,22,0.9) 0%, #0A0A0E 100%);' +
        'box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);'
    };
  }
}
</script>
</body>
</html>
