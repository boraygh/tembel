<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FF4D2E; } a:hover { color: #ff6a50; }
  </style>
</helmet>

<div style="width: 393px; height: 852px; background: #0B0B0F; font-family: Archivo, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Başlık -->
  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 68px 16px 4px 16px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: {{accent}}; text-transform: uppercase;">Tembel</div>
      <div style="font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05;">Alarmlar</div>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0B0F" stroke-width="3" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </div>
  </div>

  <!-- Sonraki alarm özeti -->
  <div style="display: flex; align-items: center; gap: 8px; padding: 18px 16px 20px 16px;">
    <div style="width: 6px; height: 6px; border-radius: 999px; background: {{accent}};"></div>
    <span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.56);">Sonraki alarm <span style="color: #FFFFFF; font-weight: 650;">8 saat 42 dakika</span> sonra</span>
  </div>

  <!-- Alarm listesi -->
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px; flex-grow: 1;">
    <sc-for list="{{alarms}}" as="alarm" hint-placeholder-count="3">
      <div style="border-radius: 20px; background: #16161C; border: 1px solid rgba(255,255,255,0.06); padding: 16px; display: flex; flex-direction: column; gap: 12px; {{alarm.dimStyle}}">

        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
            <div style="font-size: 40px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums;">{{alarm.time}}</div>
            <div style="font-size: 15px; font-weight: 550; color: rgba(255,255,255,0.56);">{{alarm.title}}</div>
          </div>
          <div style="width: 51px; height: 31px; border-radius: 999px; display: flex; align-items: center; padding: 2px; box-sizing: border-box; flex-shrink: 0; {{alarm.toggleTrackStyle}}">
            <div style="width: 27px; height: 27px; border-radius: 999px; background: #FFFFFF; {{alarm.toggleKnobStyle}}"></div>
          </div>
        </div>

        <div style="display: flex; gap: 4px;">
          <sc-for list="{{alarm.days}}" as="day" hint-placeholder-count="7">
            <div style="width: 30px; height: 24px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; letter-spacing: 0.02em; {{day.style}}">{{day.label}}</div>
          </sc-for>
        </div>

        <div style="height: 1px; background: rgba(255,255,255,0.06);"></div>

        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="display: flex; gap: 6px;">
            <sc-for list="{{alarm.taskIcons}}" as="icon" hint-placeholder-count="3">
              <div style="width: 26px; height: 26px; border-radius: 8px; background: #212129; display: flex; align-items: center; justify-content: center;">
                <sc-if value="{{icon.isShake}}" hint-placeholder-val="{{true}}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="18" rx="2"></rect><path d="M4 9v6"></path><path d="M20 9v6"></path></svg>
                </sc-if>
                <sc-if value="{{icon.isMath}}" hint-placeholder-val="{{true}}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h7"></path><path d="M7.5 3.5v7"></path><path d="M13.5 17h7"></path><path d="M14 6.5l6 6"></path><path d="M20 6.5l-6 6"></path></svg>
                </sc-if>
                <sc-if value="{{icon.isPhoto}}" hint-placeholder-val="{{true}}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.2-2h6.2l1.2 2h1.7A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5Z"></path><circle cx="12" cy="12.5" r="3"></circle></svg>
                </sc-if>
              </div>
            </sc-for>
          </div>
          <span style="font-size: 13px; font-weight: 550; color: rgba(255,255,255,0.32);">{{alarm.taskLabel}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- Sekme çubuğu -->
  <div style="display: flex; border-top: 1px solid rgba(255,255,255,0.08); background: #0E0E13; padding: 10px 0 28px 0;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9.5V13l2.5 1.5"></path><path d="M5 3 2.5 5.5"></path><path d="m19 3 2.5 2.5"></path></svg>
      <span style="font-size: 10px; font-weight: 650; color: {{accent}};">Alarmlar</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"></path></svg>
      <span style="font-size: 10px; font-weight: 550; color: rgba(255,255,255,0.32);">Ayarlar</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "accent": { "editor": "color", "default": "#FF4D2E", "options": ["#FF4D2E", "#FFB300", "#4ADE80", "#7C5CFF"] }
}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF4D2E';
    const labels = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];

    const makeDays = (selected, enabled) => labels.map((label, index) => {
      const on = selected.includes(index);
      if (on) {
        return {
          label,
          style: enabled
            ? 'background: ' + accent + '1F; color: ' + accent + ';'
            : 'background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.40);'
        };
      }
      return { label, style: 'background: transparent; color: rgba(255,255,255,0.16);' };
    });

    const shake = { isShake: true, isMath: false, isPhoto: false };
    const math = { isShake: false, isMath: true, isPhoto: false };
    const photo = { isShake: false, isMath: false, isPhoto: true };

    const onTrack = 'background: ' + accent + ';';
    const onKnob = 'margin-left: auto;';
    const offTrack = 'background: rgba(255,255,255,0.12);';
    const offKnob = '';

    const alarms = [
      {
        time: '07:30',
        title: 'İşe Kalk',
        days: makeDays([0, 1, 2, 3, 4], true),
        taskIcons: [shake, math, photo],
        taskLabel: '3 görev',
        dimStyle: '',
        toggleTrackStyle: onTrack,
        toggleKnobStyle: onKnob
      },
      {
        time: '08:45',
        title: 'Spor',
        days: makeDays([1, 3], true),
        taskIcons: [shake, math],
        taskLabel: '2 görev',
        dimStyle: '',
        toggleTrackStyle: onTrack,
        toggleKnobStyle: onKnob
      },
      {
        time: '06:15',
        title: 'Erken Kalk',
        days: makeDays([5, 6], false),
        taskIcons: [math],
        taskLabel: '1 görev',
        dimStyle: 'opacity: 0.42;',
        toggleTrackStyle: offTrack,
        toggleKnobStyle: offKnob
      }
    ];

    return { accent, alarms };
  }
}
</script>
</body>
</html>
