name: Core Tests

# TembelCore platform bağımsızdır (yalnızca Foundation kullanır), bu yüzden
# Mac gerektirmeden Linux üzerinde derlenip test edilebilir. Uygulama
# target'ı (SwiftUI / AlarmKit / CoreMotion) burada derlenmez — o Mac ister.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build --package-path Core

      - name: Test
        run: swift test --package-path Core
